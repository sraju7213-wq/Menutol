<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collapsible Categories</title>
    <style>
        /* Reset and Base Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .collapsible-category {
            margin: 0;
            padding: 0;
            border-bottom: 1px solid #ddd;
        }

        .collapsible-category details {
            margin: 0;
            padding: 0.5em;
        }

        .collapsible-category summary {
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            list-style: none;
        }

        .collapsible-category ul {
            margin: 0;
            padding-left: 1.5em;
        }

        /* Mobile Optimization */
        @media (max-width: 600px) {
            summary {
                font-size: 1em;
            }
            .collapsible-category ul {
                padding-left: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="collapsible-category">
        <details>
            <summary>Category 1</summary>
            <ul>
                <li>Item 1.1</li>
                <li>Item 1.2</li>
                <li>Item 1.3</li>
            </ul>
        </details>
        <details>
            <summary>Category 2</summary>
            <ul>
                <li>Item 2.1</li>
                <li>Item 2.2</li>
                <li>Item 2.3</li>
            </ul>
        </details>
        <details>
            <summary>Category 3</summary>
            <ul>
                <li>Item 3.1</li>
                <li>Item 3.2</li>
                <li>Item 3.3</li>
            </ul>
        </details>
    </div>
</body>
</html>
